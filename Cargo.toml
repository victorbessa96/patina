[workspace]
resolver = "2"
members = [
    "crates/umber-core",
    "crates/umber-gpu",
    "crates/umber-mesh",
    "crates/umber-brush",
    "crates/umber-bake",
    "crates/umber-graph",
    "crates/umber-export",
    "crates/umber-color",
    "crates/stylus",
    "crates/umber-cli",
    "crates/umber-app",
    "crates/umber-wasm",
    "crates/umber-plugin-sdk",
]
# The example plugins are wasm32 cdylibs with their own workspace
# (examples/Cargo.toml): a no_std panic-handler crate cannot build for
# the host under `cargo test --workspace`.
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/victorbessa96/umber"
rust-version = "1.85"

[workspace.dependencies]
# GPU trio — pinned together per docs/specs/tech-stack.md version policy
wgpu = "30"
naga = "30"
naga_oil = "0.23"

# UI
eframe = "0.36"
egui = "0.36"
egui_dock = "0.21"
egui-wgpu = "0.36"
epaint = "0.36"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"

# Foundations
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"
exr = "1"
image = { version = "0.25", default-features = false, features = ["tiff", "jpeg"] }
rayon = "1"
parking_lot = "0.12"
crossbeam = "0.8"
log = "0.4"
env_logger = "0.11"

# Perf instrumentation facade (docs/specs/perf-instrumentation-design.md):
# zero-cost no-op spans unless a backend feature is enabled.
profiling = "1"

# Mesh import
gltf = "1"
tobj = "4"
ufbx = "0.11"

# Internal crates
umber-core = { path = "crates/umber-core" }
umber-gpu = { path = "crates/umber-gpu" }
umber-mesh = { path = "crates/umber-mesh" }
umber-brush = { path = "crates/umber-brush" }
umber-bake = { path = "crates/umber-bake" }
umber-graph = { path = "crates/umber-graph" }
umber-export = { path = "crates/umber-export" }
umber-color = { path = "crates/umber-color" }
stylus = { path = "crates/stylus" }
umber-wasm = { path = "crates/umber-wasm" }
umber-plugin-sdk = { path = "crates/umber-plugin-sdk" }

# WASM plugin runtime (docs/specs/wasm-plugins-design.md; API facts
# verified against docs/claw-artifacts/wasmtime/). Default features
# kept: `wat` (text fixtures in tests) and `gc` (reference types, which
# rustc's wasm32 output enables by default) are both needed.
wasmtime = "=50.0.0-rc.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1 # keep debug builds usable with heavy GPU deps
