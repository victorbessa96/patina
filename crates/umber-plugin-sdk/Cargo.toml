[package]
name = "umber-plugin-sdk"
description = "Guest-side SDK for Umber WASM plugin nodes (no_std, wasm32-unknown-unknown)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["panic-handler"]
# Provides the `#[panic_handler]` a no_std cdylib needs (a panic becomes
# an `unreachable` trap the host reports). Only active on wasm32, so
# host builds (umber-wasm's cross-check tests) never see a second
# handler next to std's. Disable if your plugin brings its own.
panic-handler = []
